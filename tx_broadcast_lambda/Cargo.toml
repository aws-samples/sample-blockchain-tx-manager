[package]
name = "tx_broadcast_lambda"
version = "0.1.2"
edition = "2024"
license = "MIT-0"
description = "AWS Lambda function for Ethereum transaction broadcast"

[features]
default = ["nitro"]
coinbase = ["dep:reqwest", "dep:jsonwebtoken", "dep:rand"]
nitro = ["dep:reqwest", "dep:aws-sigv4", "dep:aws-credential-types", "dep:sha2"]

[dependencies]
# Nonce manager (local path - adjust for your setup)
nonce_manager = { path = "../nonce_manager" }

# AWS Lambda runtime
lambda_runtime = "0.13"
lambda_http = "0.14"

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# EIP-1559 encoding, HTTP RPC, RPC types, and local signature verification. Avoid `full`:
# this Lambda does not use KZG/blob, IPC, WebSocket, trace, Anvil, or pubsub APIs.
alloy = { version = "=2.4.2", default-features = false, features = ["consensus", "eips", "k256", "provider-http", "reqwest-rustls-tls", "rpc-types", "signer-local"] }

# TLS crypto provider for rustls
rustls = { version = "0.23", features = ["ring"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# AWS SDK
aws-config = "1"
# The SDK crates' default `rustls` feature compiles the legacy hyper 0.14 + rustls 0.21
# client (RUSTSEC h2/rustls-webpki advisories). Only the hyper 1 + aws-lc client is wanted.
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }

# Hex encoding
hex = "0.4"

# Once cell for lazy initialization
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }

# Async trait for signing abstraction
async-trait = "0.1"

# Optional: Dependencies for Coinbase CDP backend
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
jsonwebtoken = { version = "=10.4.0", optional = true }
rand = { version = "0.9", optional = true }

# Optional: SigV4 identity proofs for the Nitro signing service
aws-sigv4 = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"

# Alloy's primitive macros require the unmaintained crates.io `paste` package. Use the
# maintained API-compatible fork at this immutable 1.0.15 tag commit instead.
[patch.crates-io]
paste = { git = "https://github.com/esrauch/paste.git", rev = "a2c7e27875277450ed28147623ba5218dd23e732" }
